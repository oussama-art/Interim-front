<div class="page-container">
  <div class="page-header">
    <h1>Offres d'emploi</h1>
    <button mat-raised-button color="primary">
      <mat-icon>add</mat-icon>
      Publier une offre
    </button>
  </div>

  <div class="cards-grid">
    <div class="simple-card" *ngFor="let offer of offers">
      <div class="card-header">
        <h3>{{ offer.title }}</h3>
        <span class="status-badge" [ngClass]="getStatusClass(offer.status)">
          {{ getStatusLabel(offer.status) }}
        </span>
      </div>
      <div class="card-body">
        <p><strong>Entreprise:</strong> {{ offer.company }}</p>
        <p><strong>Localisation:</strong> {{ offer.location }}</p>
        <p><strong>Type:</strong> {{ offer.contractType }}</p>
        <p><strong>Salaire:</strong> {{ offer.salary }}</p>
        <p><strong>Candidatures:</strong> {{ offer.applicants }}</p>
      </div>
      <div class="card-footer">
        <button mat-button color="primary">Détails</button>
        <button mat-button>Candidats</button>
      </div>
    </div>
  </div>
</div>
