<div
  class="sidebar-container"
  [class.expanded]="isExpanded()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">

  <div class="logo-section">
    <div class="logo-icon-wrapper">
      <mat-icon class="logo-icon">business_center</mat-icon>
    </div>
    <span class="logo-text" [class.visible]="isExpanded()">3N Services</span>
  </div>

  <nav class="nav-links">
    <a
      *ngFor="let item of navItems()"
      [routerLink]="item.path"
      routerLinkActive="active"
      [matTooltip]="!isExpanded() ? item.label : ''"
      matTooltipPosition="right"
      class="nav-item"
      (click)="onNavClick(item)">
      <div class="nav-icon-wrapper">
        <mat-icon
          [matBadge]="item.path === '/app/offers' ? ((offerNotificationsCount$ | async) || 0) : 0"
          [matBadgeHidden]="
            item.path !== '/app/offers' ||
            isOffersRoute() ||
            ((offerNotificationsCount$ | async) || 0) === 0
          "
          matBadgeColor="warn"
          matBadgeSize="medium"
          matBadgePosition="above after">
          {{ item.icon }}
        </mat-icon>
      </div>
      <span class="nav-label" [class.visible]="isExpanded()">{{ item.label }}</span>
    </a>
  </nav>

  <div class="profil-section">
    <a
      [routerLink]="profilItem.path"
      routerLinkActive="active"
      [matTooltip]="!isExpanded() ? profilItem.label : ''"
      matTooltipPosition="right"
      class="nav-item">
      <div class="nav-icon-wrapper">
        <mat-icon>{{ profilItem.icon }}</mat-icon>
      </div>
      <span class="nav-label" [class.visible]="isExpanded()">{{ profilItem.label }}</span>
    </a>
  </div>
</div>
