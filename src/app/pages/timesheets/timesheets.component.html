<div class="page-container">
  <div class="page-header">
    <h1>Feuilles de Temps</h1>
    <button mat-raised-button color="primary">
      <mat-icon>add</mat-icon>
      Nouvelle feuille
    </button>
  </div>

  <div class="cards-grid">
    <div class="simple-card" *ngFor="let timesheet of timesheets">
      <div class="card-header">
        <h3>{{ timesheet.candidateName }}</h3>
        <span class="status-badge" [ngClass]="getStatusClass(timesheet.status)">
          {{ getStatusLabel(timesheet.status) }}
        </span>
      </div>
      <div class="card-body">
        <p><strong>Contrat:</strong> {{ timesheet.contractRef }}</p>
        <p><strong>Semaine:</strong> {{ timesheet.weekStart }} au {{ timesheet.weekEnd }}</p>
        <p><strong>Total heures:</strong> {{ timesheet.totalHours }}h</p>
      </div>
      <div class="card-footer">
        <button mat-button color="primary">Détails</button>
        <button mat-button>Modifier</button>
      </div>
    </div>
  </div>
</div>
