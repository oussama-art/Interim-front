<div class="page-container">
  <div class="page-header">
    <h1>Intérimaires</h1>
    <button mat-raised-button color="primary">
      <mat-icon>person_add</mat-icon>
      Ajouter intérimaire
    </button>
  </div>

  <div class="cards-grid">
    <div class="simple-card" *ngFor="let worker of workers">
      <div class="card-header">
        <h3>{{ worker.name }}</h3>
        <span class="status-badge" [ngClass]="getAvailabilityClass(worker.availability)">
          {{ getAvailabilityLabel(worker.availability) }}
        </span>
      </div>
      <div class="card-body">
        <p><strong>Poste:</strong> {{ worker.position }}</p>
        <p><strong>Email:</strong> {{ worker.email }}</p>
        <p><strong>Tél:</strong> {{ worker.phone }}</p>
        <p><strong>Note:</strong> {{ worker.rating }}/5 ({{ worker.completedMissions }} missions)</p>
      </div>
      <div class="card-footer">
        <button mat-button color="primary">Profil</button>
        <button mat-button>Contacter</button>
      </div>
    </div>
  </div>
</div>
