<div class="topbar">
  <div class="topbar-left">
    <div class="search-box">
      <mat-icon class="search-icon">search</mat-icon>

      <input
        type="text"
        class="search-input"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        [placeholder]="searchPlaceholder" />

      <button
        mat-icon-button
        class="clear-button"
        *ngIf="searchQuery"
        (click)="clearSearch()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="topbar-right">
    <button
      mat-icon-button
      class="topbar-action-button"
      [matMenuTriggerFor]="notificationMenu"
      aria-label="Notifications">
      <mat-icon
        [matBadge]="(unreadOfferNotificationsCount$ | async) || 0"
        [matBadgeHidden]="((unreadOfferNotificationsCount$ | async) || 0) === 0"
        matBadgeColor="warn"
        matBadgeSize="small"
        matBadgePosition="above after">
        notifications
      </mat-icon>
    </button>

    <mat-menu #notificationMenu="matMenu" class="notification-menu">
      <div class="notification-menu-header" (click)="$event.stopPropagation()">
        <div class="notification-menu-header-text">
          <span class="notification-menu-title">Notifications</span>
          
        </div>
      </div>

      <ng-container *ngIf="offerNotifications$ | async as notifications">
        <div
          class="notification-empty"
          *ngIf="notifications.length === 0"
          (click)="$event.stopPropagation()">
          <mat-icon>notifications_none</mat-icon>
          <span>Aucune notification</span>
        </div>

        <div class="notification-list-scroll" *ngIf="notifications.length > 0">
          <button
            mat-menu-item
            *ngFor="let notification of notifications; trackBy: trackByNotificationId"
            class="notification-item"
            [class.unread]="!notification.read"
            [class.read]="notification.read"
            (click)="onNotificationClick(notification)">

            <div class="notification-item-content">
              <div class="notification-item-top">
                <span class="notification-title">{{ notification.title }}</span>
                <span
                  class="notification-status-dot"
                  *ngIf="!notification.read">
                </span>
              </div>

              <div class="notification-message">
                {{ notification.message }}
              </div>

              <div class="notification-date">
                {{ formatNotificationDate(notification.createdAt) }}
              </div>
            </div>
          </button>
        </div>
      </ng-container>
    </mat-menu>

    <button
      mat-icon-button
      class="topbar-profile-button"
      [matMenuTriggerFor]="userMenu"
      aria-label="Profil utilisateur">
      <mat-icon>person</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" class="user-menu">
      <button mat-menu-item (click)="goToProfile()">
        <mat-icon>person</mat-icon>
        <span>Mon Profil</span>
      </button>

      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Déconnexion</span>
      </button>
    </mat-menu>
  </div>
</div>
