<div class="created-accounts-dialog">
  <div class="dialog-header">
    <div class="header-content">
      <mat-icon class="success-icon">check_circle</mat-icon>
      <div>
        <h2>Comptes créés avec succès</h2>
        <p class="company-name">{{ companyTitle }}</p>
      </div>
    </div>
    <button mat-icon-button class="close-btn" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="warning-banner">
    <mat-icon>warning</mat-icon>
    <div>
      <strong>Important :</strong> Les mots de passe sont affichés une seule fois.
      Copiez-les ou téléchargez-les avant de fermer cette fenêtre.
    </div>
  </div>

  <div class="accounts-table">
    <table mat-table [dataSource]="accounts" class="mat-elevation-z2">
      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let account">
          <div class="email-cell">
            <mat-icon class="cell-icon">email</mat-icon>
            {{ account.email }}
          </div>
        </td>
      </ng-container>

      <!-- Password Column -->
      <ng-container matColumnDef="password">
        <th mat-header-cell *matHeaderCellDef>Mot de passe temporaire</th>
        <td mat-cell *matCellDef="let account">
          <div class="password-cell">
            <code class="password-value">{{ account.password }}</code>
          </div>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let account">
          <button
            mat-icon-button
            color="primary"
            (click)="copyPassword(account.password)"
            matTooltip="Copier le mot de passe"
          >
            <mat-icon>content_copy</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div class="dialog-actions">
    <div class="action-buttons">
      <button mat-stroked-button (click)="copyAllAccounts()">
        <mat-icon>content_copy</mat-icon>
        Copier tout
      </button>
      <button mat-stroked-button (click)="downloadAccounts()">
        <mat-icon>download</mat-icon>
        Télécharger
      </button>
    </div>
    <button mat-raised-button color="primary" (click)="close()">
      J'ai sauvegardé les informations
    </button>
  </div>
</div>
