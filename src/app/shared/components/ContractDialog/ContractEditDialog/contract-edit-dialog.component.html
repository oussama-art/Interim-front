<div class="pro-dialog-container edit-mode">
  <header class="pro-header">
    <div class="header-main">
      <mat-icon color="primary">edit_document</mat-icon>
      <h2>Modifier le contrat</h2>
      <span class="ref-badge">{{ data.reference }}</span>
    </div>
    <button mat-icon-button (click)="dialogRef.close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <form [formGroup]="editForm" (ngSubmit)="onSave()">
    <div class="pro-content">
      <div class="identity-section">
        <div class="logo-preview" matTooltip="Changer la photo">
          <mat-icon>add_a_photo</mat-icon>
        </div>
        <div class="primary-info">
          <mat-form-field appearance="outline" class="w-100 no-subscript">
            <mat-label>Collaborateur</mat-label>
            <input matInput formControlName="candidateName" />
          </mat-form-field>
        </div>
      </div>

      <div class="divider"></div>

      <div class="info-grid">
        <div class="info-item">
          <label><mat-icon>work_outline</mat-icon> Poste occupé</label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput formControlName="position" />
          </mat-form-field>
        </div>

        <div class="info-item">
          <label><mat-icon>business</mat-icon> Entreprise cliente</label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput formControlName="clientName" />
          </mat-form-field>
        </div>

        <div class="info-item">
          <label>
            <mat-icon>calendar_today</mat-icon>
            Date de début
          </label>

          <mat-form-field appearance="outline" class="w-100">
            <input matInput type="date" formControlName="startDate" />
          </mat-form-field>
        </div>

        <div class="info-item">
          <label>
            <mat-icon>calendar_today</mat-icon>
            Date de fin
          </label>

          <mat-form-field appearance="outline" class="w-100">
            <input matInput type="date" formControlName="endDate" />
          </mat-form-field>
        </div>

        <div class="info-item salary-highlight">
          <label><mat-icon>payments</mat-icon> Rémunération Mensuelle</label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput type="number" formControlName="salary" />
            <span matSuffix>MAD</span>
          </mat-form-field>
        </div>

        <div class="info-item">
          <label><mat-icon>rule</mat-icon> Statut du contrat</label>
          <mat-form-field appearance="outline" class="w-100">
            <mat-select formControlName="status">
              <mat-option value="active">Actif</mat-option>
              <mat-option value="pending">En attente</mat-option>
              <mat-option value="completed">Terminé</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </div>

    <footer class="pro-actions">
      <button
        mat-button
        type="button"
        (click)="dialogRef.close()"
        class="btn-secondary"
      >
        Annuler
      </button>
      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="editForm.invalid"
        class="btn-primary"
      >
        Enregistrer les modifications
      </button>
    </footer>
  </form>
</div>
